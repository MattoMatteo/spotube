# Windows installer for Matubefy. Mirrors the Windows job of
# spotube-release-binary.yml, but publishes the installer to a GitHub release
# instead of uploading Actions artifacts (release assets don't count against the
# Actions storage quota).
# Run by hand it uploads to a test pre-release, which the app never offers as an
# update; release.yml calls it to fill the draft of a real release.
name: Fork Windows Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: Test pre-release the installer is uploaded to (replaced on every build)
        default: test-build
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

permissions:
  contents: write

jobs:
  windows:
    # windows-2025 now ships Visual Studio 2026, which Flutter 3.35.2 doesn't recognise
    # (falls back to the missing "Visual Studio 16 2019" generator). 2022 has VS 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install windows dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=windows --arch=x86

      - name: Build windows installer
        run: dart cli/cli.dart build --arch=x86 windows
        env:
          CHANNEL: stable
          # Update check on (our releases). Last.fm keys are optional repo secrets;
          # without them scrobbling won't work.
          DOTENV: |
            ENABLE_UPDATE_CHECK=1
            HIDE_DONATIONS=0
            LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || 'none' }}
            LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET || 'none' }}

      - name: Upload installer to release ${{ inputs.release_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          # The app's updater picks the asset by its -setup.exe suffix
          exe="Matubefy-$version-windows-setup.exe"
          cp dist/Spotube-windows-x86_64-setup.exe "$exe"
          # A real release is created as a draft by release.yml beforehand
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Matubefy test build" \
              --notes "Test build from branch \`$GITHUB_REF_NAME\`, not offered as an update by the app."
          fi
          # License files travel with the binaries (BSD-4-Clause, MIT, GPL-3.0 require it)
          gh release upload "$TAG" "$exe" LICENSE NOTICE.md licenses/*.txt --clobber
