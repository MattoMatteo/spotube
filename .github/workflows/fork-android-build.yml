# Android APK for Matubefy (application id io.github.mattomatteo.matubefy,
# installs next to the official Spotube). Mirrors the Android job of
# spotube-release-binary.yml and uploads the APK to a GitHub release (no
# Actions artifacts).
# Run by hand it uploads to a test pre-release, which the app never offers as an
# update; release.yml calls it to fill the draft of a real release.
name: Fork Android Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: Test pre-release the APK is uploaded to (replaced on every build)
        default: test-build
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The APK must be signed with the fork's own key, always the same one,
      # or installed builds can't be updated: fail instead of falling back to
      # android/app/build.gradle's debug signing
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Repository secrets KEYSTORE and KEY_PROPERTIES are required to sign the APK"
            exit 1
          fi

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install android dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      - name: Sign Apk
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build android APK
        run: dart cli/cli.dart build --arch=all android
        env:
          CHANNEL: stable
          # Same .env as the Windows build: update check (our releases), optional
          # Last.fm keys
          DOTENV: |
            ENABLE_UPDATE_CHECK=1
            HIDE_DONATIONS=0
            LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || 'none' }}
            LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET || 'none' }}

      # Informational only: should show the fork's certificate (CN=Matteo Calautti...)
      - name: Show APK signer
        continue-on-error: true
        run: |
          apk=build/Spotube-android-all-arch.apk
          ls -la "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "$apk" 2>&1 | head -20 || true
          else
            echo "apksigner not found under $ANDROID_HOME/build-tools"
          fi
          keytool -printcert -jarfile "$apk" 2>&1 | head -12 || true

      - name: Upload APK to release ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          # The app's updater picks the asset by its .apk extension
          apk="Matubefy-$version-android.apk"
          cp build/Spotube-android-all-arch.apk "$apk"
          # A real release is created as a draft by release.yml beforehand
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Matubefy test build" \
              --notes "Test build from branch \`$GITHUB_REF_NAME\`, not offered as an update by the app."
          fi
          # License files travel with the binaries (BSD-4-Clause, MIT, GPL-3.0 require it)
          gh release upload "$TAG" "$apk" LICENSE NOTICE.md licenses/*.txt --clobber
