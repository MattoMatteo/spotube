# Windows-only build for this fork of Spotube 5.1.2.
# Mirrors the Windows job of spotube-release-binary.yml, but publishes the
# installer to a GitHub pre-release instead of uploading Actions artifacts
# (release assets don't count against the Actions storage quota).
name: Fork Windows Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: Pre-release tag the installer is uploaded to (replaced on every build)
        default: v5.1.2-fork

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install windows dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=windows --arch=x86

      - name: Build windows installer
        run: dart cli/cli.dart build --arch=x86 windows
        env:
          CHANNEL: stable
          # Update check off, so the app doesn't offer the upstream releases.
          # Last.fm keys are optional repo secrets; without them scrobbling won't work.
          DOTENV: |
            ENABLE_UPDATE_CHECK=0
            HIDE_DONATIONS=0
            LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || 'none' }}
            LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET || 'none' }}

      - name: Upload installer to pre-release ${{ inputs.release_tag }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.release_tag }}
          commit: ${{ github.sha }}
          name: Spotube 5.1.2 (fork build)
          body: |
            Unofficial Windows build of Spotube 5.1.2 from branch `${{ github.ref_name }}`, commit ${{ github.sha }}.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/Spotube-windows-x86_64-setup.exe
